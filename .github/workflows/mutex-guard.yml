name: mutex-guard

# Gates every push and pull request: any change that invalidates the Subsystem
# mutex contract (see MUTEX.md / tools/mutex_check.py) fails the check.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run mutex contract check
        run: python3 tools/mutex_check.py
